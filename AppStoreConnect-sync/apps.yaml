# Maps each app's website page to the sibling repo that holds its real App
# Store Connect metadata (managed there via the `asc` CLI). Used by sync.py
# to pull the currently-live version's copy for review before hand-editing
# the site, and by assets.py to copy the app's icon and screenshots in.
#
# `config` is the app's asc-config.yaml, relative to `repo`; its folder is
# the app's ASC folder (metadata.asc, screenshots/).
#
# `locales` maps ASC locale code -> site locale code. Only locales the site
# actually renders for that page are listed; anything else ASC has for the
# app (e.g. Acidic Slime's ar-SA/fr-FR/it/ko) is intentionally
# left out here and skipped, not an error.
#
# `icon` / `icon_dark` are the app's 1024px icon, relative to `repo`. They
# are spelled out because icons live in the asset catalog, not the ASC
# folder, and several repos carry many alternate icon sets. `site_icon` /
# `site_icon_dark` are where they land in this repo.
#
# Screenshots land in assets/images/appstore/<app-key>/.
#
# `icon_only` (optional, same shape minus config/platform/locales) is for an
# app with no ASC folder: assets.py refreshes its icon and sync.py ignores it.

apps:
  acidic-slime:
    page: acidic-slime.html
    prefix: app
    repo: ~/Projects/AcidicSlime
    config: AppStoreConnect/app-6761619751/asc-config.yaml
    platform: MAC_OS
    locales:
      en-US: en
      ja: ja
      zh-Hans: zh-Hans
      zh-Hant: zh-Hant
    icon: Assets/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png
    site_icon: assets/images/acidicslime-icon.png

